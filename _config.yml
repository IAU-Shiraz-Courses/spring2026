# Site settings
course_name: "Data Analysis"
course_description: "This course introduces the fundamentals of data analysis, covering data collection, cleaning, and exploratory analysis, statistical methods, data visualization, and practical tools such as Python, Pandas, and NumPy for extracting insights from real-world datasets."
course_semester: "spring 2026"

baseurl: "/spring2026"
url: "https://iau-shiraz-courses.github.io"

schoolname: "Islamic Azad University, Shiraz Branch"
schoolurl: "http://iaushiraz.ac.ir"
twitter_username: ""

address: |
  Islamic Azad University, Shiraz Branch
  Shiraz, Iran

# Google Analytics
# google_analytics: UA-XXXXXXXX-X

### Do not change the followings unless you know what you are doing ###

# Build settings
markdown: kramdown

# Other options
permalink: blog/:year/:month/:title
excerpt_separator: "<!--more-->"

include: ['_images', '_css']
exclude: ['develop']

dateformat: "%m/%d/%Y"

future: true

collections:
  events:
    output: true
  lectures:
    output: true
  assignments:
    output: true
  announcements:
    output: false

defaults:
  - scope:
      path: ""
      type: "assignments"
    values:
      layout: "assignment"
